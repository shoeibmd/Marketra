services:
  postgres:
    image: postgres:16-alpine
    container_name: terminal_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-terminal_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-terminal_password}
      POSTGRES_DB: ${POSTGRES_DB:-terminal_relational}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-terminal_user} -d ${POSTGRES_DB:-terminal_relational}"]
      interval: 5s
      timeout: 5s
      retries: 5

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: terminal_timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${TIMESCALE_USER:-terminal_user}
      POSTGRES_PASSWORD: ${TIMESCALE_PASSWORD:-terminal_password}
      POSTGRES_DB: ${TIMESCALE_DB:-terminal_timeseries}
    ports:
      - "5433:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TIMESCALE_USER:-terminal_user} -d ${TIMESCALE_DB:-terminal_timeseries}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: terminal_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: terminal_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_SERVER=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-terminal_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-terminal_password}
      - POSTGRES_DB=${POSTGRES_DB:-terminal_relational}
      - TIMESCALE_SERVER=timescaledb
      - TIMESCALE_PORT=5432
      - TIMESCALE_USER=${TIMESCALE_USER:-terminal_user}
      - TIMESCALE_PASSWORD=${TIMESCALE_PASSWORD:-terminal_password}
      - TIMESCALE_DB=${TIMESCALE_DB:-terminal_timeseries}
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./backend:/app
      - /app/.venv
    depends_on:
      postgres:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: terminal_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
      - VITE_WS_BASE_URL=ws://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
  timescaledb_data:
  redis_data:
